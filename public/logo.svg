<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Deep Espresso Background Disc -->
  <rect width="120" height="120" rx="30" fill="#100F0D" />
  
  <!-- Outer Archival Ring with Antique Brass Border -->
  <circle cx="60" cy="60" r="54" stroke="#C8A97E" stroke-width="1.2" stroke-opacity="0.35" />
  <circle cx="60" cy="60" r="50" stroke="#C8A97E" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.45" />

  <!-- Cardinal Compass Coordinates (Astrolabe / Odyssey motif) -->
  <line x1="60" y1="8" x2="60" y2="13" stroke="#C8A97E" stroke-width="1.5" stroke-linecap="round" />
  <line x1="60" y1="107" x2="60" y2="112" stroke="#C8A97E" stroke-width="1.5" stroke-linecap="round" />
  <line x1="8" y1="60" x2="13" y2="60" stroke="#C8A97E" stroke-width="1.5" stroke-linecap="round" />
  <line x1="107" y1="60" x2="112" y2="60" stroke="#C8A97E" stroke-width="1.5" stroke-linecap="round" />

  <!-- Inner Subtle Celestial Ring -->
  <circle cx="60" cy="60" r="38" fill="#181715" stroke="#C8A97E" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Classical Editorial Monogram: Intertwined "H" & "S" + Odyssey Galley Prow -->
  <!-- Left Pillar of 'H' -->
  <path d="M 43 38 L 43 82" stroke="#C8A97E" stroke-width="3" stroke-linecap="round" />
  <!-- Serifs for Left Pillar -->
  <line x1="39" y1="38" x2="47" y2="38" stroke="#F5F2EB" stroke-width="1.5" stroke-linecap="round" />
  <line x1="39" y1="82" x2="47" y2="82" stroke="#F5F2EB" stroke-width="1.5" stroke-linecap="round" />

  <!-- Right Pillar of 'H' -->
  <path d="M 77 38 L 77 82" stroke="#C8A97E" stroke-width="3" stroke-linecap="round" />
  <!-- Serifs for Right Pillar -->
  <line x1="73" y1="38" x2="81" y2="38" stroke="#F5F2EB" stroke-width="1.5" stroke-linecap="round" />
  <line x1="73" y1="82" x2="81" y2="82" stroke="#F5F2EB" stroke-width="1.5" stroke-linecap="round" />

  <!-- Intersecting Crossbar of 'H' transitioning into Golden Ratio Odyssey Wave -->
  <line x1="43" y1="60" x2="77" y2="60" stroke="#C8A97E" stroke-width="2.5" stroke-linecap="round" />

  <!-- Calligraphic 'S' Weaving Through the Center in Warm Ivory -->
  <path d="M 72 45 C 72 40, 60 38, 54 44 C 47 50, 52 57, 60 60 C 69 63, 73 70, 66 77 C 59 83, 46 80, 47 74" 
        stroke="#F5F2EB" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Odyssey Astrolabe Star at Zenith -->
  <polygon points="60,20 62,25 67,27 62,29 60,34 58,29 53,27 58,25" fill="#C8A97E" />
</svg>
